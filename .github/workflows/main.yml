# Automatically synchronize rdpwrap.ini from the sebaxakerhtc/rdpwrap.ini project  
# via GitHub Action

name: Automatic Sync rdpwrap.ini

# trigger  
on:
  push:
    branches:
      - master
  
  schedule:
    # run every hour at 18 minutes.
    - cron: '18 * * * *'

  workflow_dispatch: # manually trigger a workflow run
  
  # Triggering this event needs to be set up in the target repository.
  repository_dispatch:
    types: [rdpwrap-update] # trigger event name

jobs:
  sync:
    runs-on: ubuntu-latest
    
    permissions:                # Job-level permissions configuration starts here  
      contents: write           # 'write' access to repository contents  
      pull-requests: write      # 'write' access to pull requests

    steps:
    - name: ✨ Checkout repository  
      uses: actions/checkout@v4

    - name: 🎄 Download rdpwrap.ini in sebaxakerhtc/rdpwrap.ini  
      run: |
        curl --fail --location --retry 3 --connect-timeout 15 \
          https://raw.githubusercontent.com/sebaxakerhtc/rdpwrap.ini/master/rdpwrap.ini \
          --output rdpwrap.ini.download
        grep -q '^\[Main\]' rdpwrap.ini.download
        grep -Eq '^Updated=[0-9]{4}-[0-9]{2}-[0-9]{2}$' rdpwrap.ini.download
        grep -q '^\[SLPolicy\]' rdpwrap.ini.download
        echo "🎄 Downloaded and validated rdpwrap.ini."
    
    - name: Check for rdpwrap.ini differences  
      id: diff-check  
      run: |
        # compare rdpwrap.ini and rdpwrap.ini.bak  
        if cmp -s res/rdpwrap.ini rdpwrap.ini.download; then
          echo "🎇 No differences found."
          echo "diff=true" >> $GITHUB_OUTPUT  
          rm rdpwrap.ini.download
        else  
          echo "🎃 Differences found."
          echo "diff=false" >> $GITHUB_OUTPUT  
          cp res/rdpwrap.ini bak/res/rdpwrap.ini.bak
          mv rdpwrap.ini.download res/rdpwrap.ini
        fi

    - name: 🧨 Commit files  
      if: steps.diff-check.outputs.diff == 'false'
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -- res/rdpwrap.ini bak/res/rdpwrap.ini.bak
        git commit -m "Automatic sync rdpwrap.ini from sebaxakerhtc/rdpwrap.ini"
        
    - name: 🎉 Push changes  
      if: steps.diff-check.outputs.diff == 'false'
      run: git push origin HEAD:${{ github.ref_name }}
    
    - name: 🚀 Finish! Notice bobo download Server  
      if: steps.diff-check.outputs.diff == 'false'
      continue-on-error: true
      run: |
        curl --fail --max-time 15 -X GET 'https://api.rpyf.top/rdpwrap.php'
