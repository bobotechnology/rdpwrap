name: Automatic Sync rdpwrap.ini

on:
  push:
    branches: [master]
  schedule:
    - cron: "18 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [rdpwrap-update]

# Do not let an hourly run and a manual/webhook run update master concurrently.
concurrency:
  group: rdpwrap-ini-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and validate rdpwrap.ini
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 --silent --show-error \
            https://raw.githubusercontent.com/sebaxakerhtc/rdpwrap.ini/master/rdpwrap.ini \
            --output rdpwrap.ini.download

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("rdpwrap.ini.download")
          data = path.read_bytes()
          if not 1024 <= len(data) <= 16 * 1024 * 1024:
              raise SystemExit(f"Invalid INI size: {len(data)} bytes")
          if b"\0" in data:
              raise SystemExit("Invalid INI: contains a NUL byte")

          try:
              text = data.decode("utf-8-sig")
          except UnicodeDecodeError as error:
              raise SystemExit(f"Invalid INI encoding: {error}") from error

          lines = text.splitlines()
          required_sections = {"[Main]", "[SLPolicy]"}
          missing = required_sections.difference(lines)
          if missing:
              raise SystemExit("Missing required section(s): " + ", ".join(sorted(missing)))

          updated = [line for line in lines if line.startswith("Updated=")]
          if len(updated) != 1 or not re.fullmatch(
              r"Updated=\d{4}-\d{2}-\d{2}", updated[0]
          ):
              raise SystemExit(f"Invalid Updated field: {updated!r}")

          if not any(re.fullmatch(r"\[\d+\.\d+\.\d+\.\d+\]", line) for line in lines):
              raise SystemExit("Invalid INI: no Terminal Services version sections")

          # Repository .gitattributes requires CRLF for *.ini. Canonicalizing
          # here prevents line-ending-only commits and also removes a UTF-8 BOM.
          path.write_bytes(("\r\n".join(lines) + "\r\n").encode("utf-8"))
          print(f"Validated {len(lines)} lines; {updated[0]}")
          PY

      - name: Compare configuration
        id: compare
        shell: bash
        run: |
          set -Eeuo pipefail
          if cmp -s res/rdpwrap.ini rdpwrap.ini.download; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "rdpwrap.ini is already current."
            rm -f rdpwrap.ini.download
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cp -- res/rdpwrap.ini bak/res/rdpwrap.ini.bak
            mv -- rdpwrap.ini.download res/rdpwrap.ini
            echo "rdpwrap.ini has changed."
          fi

      - name: Commit and push update
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- res/rdpwrap.ini bak/res/rdpwrap.ini.bak
          git diff --cached --check
          git commit -m "Automatic sync rdpwrap.ini from sebaxakerhtc/rdpwrap.ini"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Notify download server
        if: steps.compare.outputs.changed == 'true'
        continue-on-error: true
        run: >-
          curl --fail --max-time 15 --silent --show-error
          https://api.rpyf.top/rdpwrap.php
