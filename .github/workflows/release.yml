name: Publish release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version line to start after a stable release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: Release channel (bump is ignored while continuing or promoting a prerelease)
        required: true
        default: stable
        type: choice
        options:
          - stable
          - alpha
          - beta
          - rc

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout master with tags
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Calculate and write next version
        id: version
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          git fetch origin master --tags

          $text = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($text -notmatch '^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.([1-9]\d*))?$') {
            throw "VERSION is not semantic x.y.z or x.y.z-(alpha|beta|rc).N: $text"
          }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3]
          $currentChannel = if ($Matches[4]) { [string]$Matches[4] } else { '' }
          $currentTag = "v$text"
          git rev-parse --verify --quiet "refs/tags/$currentTag" *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "VERSION ($text) does not match an existing release tag ($currentTag)"
          }

          $channel = $env:CHANNEL
          if ($channel -notin @('stable', 'alpha', 'beta', 'rc')) {
            throw "Unsupported release channel: $channel"
          }

          if ($currentChannel) {
            $base = "$major.$minor.$patch"
            Write-Host "Continuing or promoting prerelease line $base; bump=$env:BUMP is ignored."
          } else {
            switch ($env:BUMP) {
              'major' { $major++; $minor = 0; $patch = 0 }
              'minor' { $minor++; $patch = 0 }
              'patch' { $patch++ }
              default { throw "Unsupported version bump: $env:BUMP" }
            }
            $base = "$major.$minor.$patch"
          }

          if ($channel -eq 'stable') {
            $next = $base
            $prerelease = 'false'
          } else {
            $prefix = "v$base-$channel."
            $pattern = '^' + [regex]::Escape($prefix) + '([1-9]\d*)$'
            $sequence = 0
            foreach ($candidate in @(git tag --list "$prefix*")) {
              if ($candidate -match $pattern) {
                $sequence = [Math]::Max($sequence, [int]$Matches[1])
              }
            }
            $next = "$base-$channel.$($sequence + 1)"
            $prerelease = 'true'
          }

          $tag = "v$next"
          git rev-parse --verify --quiet "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag already exists: $tag" }

          [IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE 'VERSION'),
            "$next`n",
            [Text.UTF8Encoding]::new($false))
          "version=$next" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "base_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          Write-Host "Preparing $tag"

      - name: Build and verify release bundle
        shell: pwsh
        run: ./.github/scripts/build-release.ps1

      - name: Create release archives
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archive = "RDPWrap-v$env:VERSION.zip"
          Compress-Archive -Path dist/* -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE 'SHA256SUMS.txt'),
            "$hash  $archive`n",
            [Text.UTF8Encoding]::new($false))

      - name: Upload packaged release artifact
        uses: actions/upload-artifact@v7
        with:
          name: RDPWrap-release-${{ steps.version.outputs.version }}
          path: |
            RDPWrap-v${{ steps.version.outputs.version }}.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit version, tag, and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          BASE_SHA: ${{ steps.version.outputs.base_sha }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          git fetch origin master --tags
          $remote = (git rev-parse origin/master).Trim()
          if ($remote -ne $env:BASE_SHA) {
            throw "origin/master changed during release build; rerun the workflow"
          }

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- VERSION
          git diff --cached --check
          git commit -m "Release $env:TAG [skip ci]"
          git tag -a $env:TAG -m "RDP Wrapper $env:TAG"
          git push --atomic origin HEAD:master "refs/tags/$env:TAG"

          $archive = "RDPWrap-v$env:VERSION.zip"
          $arguments = @(
            'release', 'create', $env:TAG,
            $archive, 'SHA256SUMS.txt',
            '--verify-tag', '--generate-notes',
            '--title', "RDP Wrapper $env:TAG"
          )
          if ($env:PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
            $arguments += '--latest=false'
          } else {
            $arguments += '--latest'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
