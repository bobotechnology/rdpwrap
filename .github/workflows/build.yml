name: Build MSVC release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and verify release bundle
        shell: pwsh
        run: ./.github/scripts/build-release.ps1

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: RDPWrap-msvc-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
