name: Build MSVC release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build x64 wrapper
        shell: pwsh
        run: |
          cmake -S . -B build-x64 -G "Visual Studio 17 2022" -A x64
          cmake --build build-x64 --config Release --target rdpwrap --parallel

      - name: Build Win32 aggregate installer
        shell: pwsh
        run: |
          $rdpw64 = Join-Path $env:GITHUB_WORKSPACE "build-x64/bin/Release/rdpwrap.dll"
          if (-not (Test-Path -LiteralPath $rdpw64)) {
            throw "Missing x64 wrapper: $rdpw64"
          }
          cmake -S . -B build-x86 -G "Visual Studio 17 2022" -A Win32 `
            "-DINSTALLER_RDPW64=$rdpw64"
          cmake --build build-x86 --config Release --target RDPWInst --parallel

      - name: Assemble release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build-x86/bin/Release/RDPWInst.exe dist/
          Copy-Item build-x86/bin/Release/RDP_CnC.exe dist/
          Copy-Item build-x86/bin/Release/rdpwrap.dll dist/rdpwrap-x86.dll
          Copy-Item build-x64/bin/Release/rdpwrap.dll dist/rdpwrap-x64.dll
          Copy-Item res/rdpwrap.ini dist/
          Copy-Item bin/install.bat,bin/update.bat,bin/uninstall.bat dist/
          Copy-Item README.md,README_CN.md,LICENSE dist/
          Get-ChildItem dist | Format-Table Name,Length

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDPWrap-msvc-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
